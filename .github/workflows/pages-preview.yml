name: Deploy preview-fase1 to GitHub Pages

on:
  push:
    branches: [preview-fase1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview-fase1
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview-fase1
        uses: actions/checkout@v4
        with:
          ref: preview-fase1
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload public/ as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
